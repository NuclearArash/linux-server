name: Bot Server

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

concurrency:
  group: bot-server-singleton
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Restore Dynamic Bot Fleet
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/bot-server/bot-registry.json
            /home/runner/bot-server/.bot_credentials_key
            /home/runner/bot-server/bots
            /home/runner/bot-server/state.json
          key: bot-fleet-${{ github.run_id }}
          restore-keys: |
            bot-fleet-

      - name: Restore Hermes State
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.hermes
          key: hermes-state-${{ github.run_id }}
          restore-keys: |
            hermes-state-

      - name: Restore 9Router State
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.9router
          key: 9router-state-${{ github.run_id }}
          restore-keys: |
            9router-state-

      - name: Setup Environment
        env:
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME || secrets.SERVER_USERNAME || 'admin' }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'admin' }}
        run: ./scripts/setup.sh

      - name: Start Telegram Bots, Panel & Tunnels
        env:
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME || secrets.SERVER_USERNAME || 'admin' }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'admin' }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          STATUS_BOT_TOKEN: ${{ secrets.STATUS_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          HERMES_TELEGRAM_BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM_BOT_TOKEN }}
          HERMES_API_SERVER_KEY: ${{ secrets.HERMES_API_SERVER_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/start-bots.sh

      - name: Send Startup Notification to Telegram
        env:
          STATUS_BOT_TOKEN: ${{ secrets.STATUS_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME || secrets.SERVER_USERNAME || 'admin' }}
        run: ./scripts/heartbeat.sh

      - name: Keep Server Active (5h 45m or until Redeploy)
        run: |
          echo "Server running for 5 hours 45 minutes (20700s). Checking for early redeploy trigger..."
          TOTAL_SECONDS=20700
          ELAPSED=0
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            if [ -f /tmp/redeploy.trigger ]; then
              echo ">> Redeploy triggered! Shutting down current server to allow new instance to take over..."
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            if [ $((ELAPSED % 1800)) -eq 0 ]; then
              MINS=$((ELAPSED / 60))
              echo "[$MINS/345m] Server is active and operational."
            fi
          done

      - name: Stop Bots, Panel & Tunnels
        if: always()
        run: ./scripts/stop-bots.sh

      - name: Save Dynamic Bot Fleet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/bot-server/bot-registry.json
            /home/runner/bot-server/.bot_credentials_key
            /home/runner/bot-server/bots
            /home/runner/bot-server/state.json
          key: bot-fleet-${{ github.run_id }}

      - name: Save Hermes State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.hermes
          key: hermes-state-${{ github.run_id }}

      - name: Save 9Router State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.9router
          key: 9router-state-${{ github.run_id }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-server-logs-${{ github.run_id }}
          path: |
            /tmp/bot-*.log
            /tmp/panel.log
            /tmp/cloudflared.log
            /tmp/hermes.log
            /tmp/9router.log
          if-no-files-found: warn

      - name: Trigger Next Workflow Run (if not redeploying)
        if: success()
        run: |
          if [ -f /tmp/redeploy.trigger ]; then
            echo "Redeploy already scheduled by trigger. Skipping duplicate dispatch."
          else
            echo "5h 45m session finished. Triggering next workflow run..."
            gh workflow run server.yml --ref ${{ github.ref }} || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
